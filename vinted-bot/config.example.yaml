# ──────────────────────────────────────────────────────────────────────
#  Vinted-Deal-Bot – Einstellungen
#  Kopie dieser Datei heißt "config.yaml" (legt start.bat beim ersten Start an).
#  Fast alles lässt sich später auch per Telegram ändern (/hilfe).
#  Einrücken nur mit Leerzeichen, nie mit Tab!
# ──────────────────────────────────────────────────────────────────────

notifications:
  push: sniper                 # 🔔 Push-Ton nur für ⚡ Sniper-Treffer (Rest lautlos) · alle · aus   (/push)
  telegram:
    token: ""                  # von @BotFather, z. B. 123456:ABC-DEF…
    chat_id: ""                # mit "start.bat chat-id" herausfinden
  discord:
    webhook_url: ""            # optional
  ntfy:
    topic: ""                  # optional: Push ohne Konto (App "ntfy", geheimes Thema ausdenken)
    server: https://ntfy.sh

# 💰 SCHNÄPPCHEN-RADAR: frisch hochgeladene Teile weit unter Wert
resale:
  enabled: true
  brands: [trends]             # "trends" = 76 eingebaute Marken & Trends (Carhartt, Stüssy, Vintage Adidas,
                               # Nike Tech Fleece, Vintage Lederjacke, Y2K …) – eigene dazu: [trends, Ganni]
  level: auto                  # auto (hält 20–60 Treffer/Std.) · offen · locker · normal · streng   (/stufe)
  budget: 30                   # 💶 höchstens so viel pro Teil                                (/budget 25)
  budget_brands: 80            # Ausnahme für teure Marken (Luxus, Designer, Outdoor-Premium)  (/budget marken 100)
  sniper: true                 # ⚡ alle paar Sekunden die neuesten Uploads auf ganz Vinted    (/radar an|aus)
  sniper_every_seconds: 4
  # sniper_link: "https://www.vinted.de/catalog?…"   # optional: Sniper nur für diesen Link (z. B. deine Marken)
  shipping_estimate: 5         # Versandkosten für die Gewinn-Rechnung

# 🎯 Was gemeldet wird
filters:
  sizes: [S, M, L]             # deine Größen ("alle" = egal). Ohne Größe (Taschen, Caps) kommt immer durch
  exclude_types: [schuhe]      # ausgeblendete Kategorien (/kategorien)
  only_rare: false             # true = nur Raritäten
  fake_ampel: streng           # 🛡 streng (🔴 nicht melden) · warnen · aus   (/ampel)

# 👗 BILDMODELL (lokal, kostenlos) – einmalig ki-installieren.bat ausführen, dann in Telegram /sammeln
ml:
  enabled: true
  backbone: fashion            # fashion = Mode-Spezialist (~110 ms/Foto) · schnell = für schwache PCs (~40 ms)
  threads: 2                   # Prozessorkerne fürs Bildmodell
  train_every_hours: 6

# 🤖 KI-BILDCHECK mit Claude (optional, kostet ein paar Cent pro Treffer – Schlüssel: console.anthropic.com)
ai:
  enabled: false
  api_key: ""                  # oder Umgebungsvariable ANTHROPIC_API_KEY
  model: claude-opus-5-5       # günstiger: claude-sonnet-5-5
  max_checks_per_day: 40       # Kostenbremse
  max_second_looks_per_day: 20

# 💸 ANGEBOTE per Button (experimentell) – braucht die Cookies deines Vinted-Logins (siehe README).
# Diese Datei dann NIEMALS teilen oder hochladen!
account:
  enabled: false
  cookies: ""
  offer_discounts: [10, 20]    # Buttons für −10 % und −20 %

vinted:
  domain: vinted.de            # oder vinted.at, vinted.fr …
  workers: 2                   # parallele Sucher
  request_gap_seconds: 1.0     # Abstand zwischen zwei Anfragen (kleiner = schneller, aber eher Blockaden)
  # proxy: http://user:pass@host:port

scoring:
  # Titel mit diesen Wörtern werden nie gemeldet ("kein Fake", "nicht defekt" zählen nicht):
  global_exclude_words: [fake, replica, replika, rep, nachbau, inspired, dupe, defekt, kaputt, bastler, suche, tausch]

database: vinted_bot.db

# 🔎 EIGENE SUCHEN – zusätzlich zum Schnäppchen-Radar, mit eigenen Grenzen.
# Am einfachsten per Telegram: /neu nike air max 90 bis 40 score 60
searches: []
  # Beispiele – zum Benutzen "#" entfernen und oben "searches: []" durch "searches:" ersetzen:
  # - name: Air Max 90
  #   keywords: nike air max 90
  #   max_price: 40
  #   sizes: ["43", "44"]
  #   min_score: 60
  # - name: Carhartt Jacken        # Profi: Suche auf vinted.de mit Filtern einstellen, Link einfügen
  #   url: "https://www.vinted.de/catalog?search_text=carhartt%20jacke&order=newest_first"
  #   max_price: 40
  #   min_score: 70
