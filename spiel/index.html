<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cityscapes</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Cityscapes – ein 3D-Städtebau- und Verkehrsspiel im Browser. Zonen, Versorgung, Verkehr und eine U-Bahn, deren Züge Musik machen.">
<meta name="theme-color" content="#4a2199">
<link rel="preload" href="fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="hud" hidden></div>
  <div id="menu"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="tooltip" hidden></div>
  <div id="loader" class="loader boot" role="status" aria-live="polite">
    <div class="ld-sky"><i></i><i></i><i></i></div>
    <div class="ld-card">
      <div class="ld-brand"><svg width="54" height="54" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="21.3" cy="11.2" r="4.6" fill="#ffb020"/><path fill="#ffffff" fill-rule="evenodd" d="M6 30V19h5v11zM12 30V11.5l2.5-2V6h1v3.5l2.5 2V30zM19 30V16h4.5v14zM24.5 30V8.5L28 6l3.5 2.5V30zM32.5 30V18H35v12zM13.5 14h3v2h-3zM13.5 18.5h3v2h-3zM13.5 23h3v2h-3zM26 11.5h4v2h-4zM26 16h4v2h-4zM26 20.5h4v2h-4zM7.5 21.5h2v2h-2zM20.5 19h1.5v2h-1.5z"/><path class="ld-pulse" d="M4.5 34h31" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="34" r="2.1" fill="#ffffff" stroke="#ffb020" stroke-width="1.4"/><circle cx="27" cy="34" r="2.1" fill="#ffffff" stroke="#ffb020" stroke-width="1.4"/></svg><b>Cityscapes</b></div>
      <div class="ld-title" id="ld-title">Die Stadt erwacht</div>
      <div class="ld-line"><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span></div>
      <div class="ld-bar"><i id="ld-fill"></i><span class="ld-shine"></span></div>
      <div class="ld-step" id="ld-step">Programm wird geladen …</div>
      <div class="ld-tip" id="ld-tip"></div>
    </div>
  </div>
  <noscript><p class="noscript">Cityscapes braucht JavaScript und WebGL.</p></noscript>
</div>
<script>
// Notfall: Wenn das Spielprogramm den Ladebildschirm nicht übernimmt (Galerie, Fehler), blendet er sich aus.
(function () {
  var l = document.getElementById('loader');
  if (!l) return;
  if (/[?&]gallery=/.test(location.search)) { l.parentNode.removeChild(l); return; }
  setTimeout(function () { if (!window.__stadtpulsLoader && l.parentNode) l.parentNode.removeChild(l); }, 9000);
})();
</script>
<script src="dist/stadtpuls.js"></script>
</body>
</html>
