<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stadtpuls</title>
<meta name="description" content="Stadtpuls – ein 3D-Städtebau- und Verkehrsspiel im Browser. Zonen, Versorgung, Verkehr und eine U-Bahn, deren Züge Musik machen.">
<meta name="theme-color" content="#4a2199">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:ital,wght@0,400..900;1,700..900&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="hud" hidden></div>
  <div id="menu"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="tooltip" hidden></div>
  <div id="loader" class="loader boot" role="status" aria-live="polite">
    <div class="ld-sky"><i></i><i></i><i></i></div>
    <div class="ld-card">
      <div class="ld-brand"><svg width="54" height="54" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path class="ld-pulse" d="M5 22h7l3-9 5 16 4-11 2 4h9" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="22" r="3.2" fill="#ffb020"/></svg><b>Stadtpuls</b></div>
      <div class="ld-title" id="ld-title">Die Stadt erwacht</div>
      <div class="ld-line"><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span><span class="ld-st"></span></div>
      <div class="ld-bar"><i id="ld-fill"></i><span class="ld-shine"></span></div>
      <div class="ld-step" id="ld-step">Programm wird geladen …</div>
      <div class="ld-tip" id="ld-tip"></div>
    </div>
  </div>
  <noscript><p class="noscript">Stadtpuls braucht JavaScript und WebGL.</p></noscript>
</div>
<script>
// Notfall: Wenn das Spielprogramm den Ladebildschirm nicht übernimmt (Galerie, Fehler), blendet er sich aus.
(function () {
  var l = document.getElementById('loader');
  if (!l) return;
  if (/[?&]gallery=/.test(location.search)) { l.parentNode.removeChild(l); return; }
  setTimeout(function () { if (!window.__stadtpulsLoader && l.parentNode) l.parentNode.removeChild(l); }, 9000);
})();
</script>
<script src="dist/stadtpuls.js"></script>
</body>
</html>
